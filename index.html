<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive 3D disaster simulation built with real world geographic data to visualize how disasters like flood affect areas."
    />
    <title>GeoSim</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>GeoSim</h1>
    </header>
    <div id="loading">
      <p>Loading world...</p>
    </div>
    <div id="error" hidden>
      <p>Failed to load world.</p>
      <button id="retry">Retry</button>
    </div>
    <div id="area-info">
      <p>Showing Area</p>
      <span id="latitude"></span>
      <span id="longitude"></span>
    </div>
    <main id="display"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
